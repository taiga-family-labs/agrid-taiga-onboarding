name: CI and GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build for GitHub Pages
        run: npm run build:pages 2>&1 | tee build.log

      - name: Prepare GitHub Pages artifact
        id: pages
        shell: bash
        run: |
          index_file="$(find dist -type f -name index.html | head -n 1)"

          if [[ -z "$index_file" ]]; then
            echo "Angular build did not produce index.html"
            find dist -maxdepth 4 -type f -print
            exit 1
          fi

          output_dir="$(dirname "$index_file")"
          cp "$index_file" "$output_dir/404.html"
          echo "path=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.pages.outputs.path }}

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
