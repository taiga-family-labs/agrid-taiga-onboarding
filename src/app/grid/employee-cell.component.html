<div class="employee-cell">
    <span class="name">{{ employee.name }}</span>

    <button
        appearance="flat"
        tuiHintAppearance="onboarding"
        tuiHintDirection="right"
        [attr.aria-label]="'Открыть комментарии: ' + employee.name"
        [class.active-anchor]="onboarding.isCommentStepFor(employee.id)"
        iconStart="@tui.message-square"
        size="xs"
        tuiIconButton
        type="button"
        [tuiHint]="stepOne"
        [tuiHintManual]="onboarding.isCommentStepFor(employee.id)"
        (click)="openComments()"
    ></button>

    <ng-template #stepOne>
        <app-onboarding-card
            actionText="Далее"
            description="По иконке комментария теперь можно увидеть и отклонения по заявке"
            preview="icons"
            title="Обоснования переехали"
            [currentStep]="1"
            (close)="onboarding.closeTour()"
            (next)="onboarding.showTabsStep(employee)"
        />
    </ng-template>
</div>
