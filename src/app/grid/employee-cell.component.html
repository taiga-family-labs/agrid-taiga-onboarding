<div class="employee-cell">
    <span class="name">{{ proposal.employeeFullName }}</span>

    <button
        appearance="flat"
        onboardingStepDirection="right"
        [attr.aria-label]="'Открыть комментарии: ' + proposal.employeeFullName"
        [onboardingStep]="
            commentOnboarding?.isTarget(proposal)
                ? commentOnboarding?.steps[0] ?? null
                : null
        "
        iconStart="@tui.message-square"
        size="xs"
        tuiIconButton
        type="button"
        (click)="openComments()"
        (onboardingStepOnNext)="sidebar.open(proposal)"
    ></button>
</div>
