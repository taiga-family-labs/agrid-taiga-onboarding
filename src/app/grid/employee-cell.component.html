<div class="employee-cell">
    <span class="name">{{ proposal.employeeFullName }}</span>

    <button
        appearance="flat"
        tuiHintAppearance="onboarding"
        tuiHintDirection="right"
        [attr.aria-label]="'Открыть комментарии: ' + proposal.employeeFullName"
        [class.onboarding-active-anchor]="onboarding.isCommentStepFor(proposal.id)"
        iconStart="@tui.message-square"
        size="xs"
        tuiIconButton
        type="button"
        [tuiHint]="onboardingStep"
        [tuiHintManual]="onboarding.isCommentStepFor(proposal.id)"
        (click)="openComments()"
    ></button>
</div>
