<tui-root>
    <main class="page">
        <header class="toolbar">
            <div>
                <h1 tuiTitle>
                    Пересмотр компенсаций
                    <span tuiSubtitle>Прототип AG Grid + Taiga UI без ngx-ui-tour</span>
                </h1>
            </div>

            <div class="toolbar-actions">
                <label class="feature-flag">
                    <input
                        type="checkbox"
                        [checked]="featureFlags.enableCommentsOnboarding()"
                        (change)="setCommentsOnboardingEnabled($event)"
                    />
                    <span>enableCommentsOnboarding</span>
                </label>

                <button
                    appearance="outline"
                    size="m"
                    tuiButton
                    type="button"
                    [disabled]="!featureFlags.enableCommentsOnboarding()"
                    (click)="startTour()"
                >
                    Запустить онбординг
                </button>
            </div>
        </header>

        <div class="workspace" [class.sidebar-open]="sidebar.opened()">
            <section class="grid-shell">
                <div class="grid-toolbar">
                    <span>Перетащите сюда для группировки по строкам</span>
                    <span>{{ rowData.length }} заявок</span>
                </div>

                <ag-grid-angular
                    class="ag-theme-quartz grid"
                    [columnDefs]="columnDefs"
                    [defaultColDef]="defaultColDef"
                    [rowData]="rowData"
                    [rowHeight]="48"
                    [theme]="'legacy'"
                    (firstDataRendered)="onFirstDataRendered()"
                    (gridReady)="onGridReady($event)"
                />
            </section>

            @if (sidebar.proposal(); as proposal) {
                <comments-sidebar
                    [proposal]="proposal"
                    (closed)="closeSidebar()"
                />
            }
        </div>
    </main>

    @if (onboarding.isRunning()) {
        <div
            aria-hidden="true"
            class="onboarding-backdrop"
        ></div>
    }
</tui-root>
